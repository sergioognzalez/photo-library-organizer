name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run tests
        run: python -B -m unittest discover -s tests -v
      - name: Start installed UI without a display
        run: python -I -B scripts/smoke_test_ui.py
      - name: Run synthetic demo
        run: python -B scripts/run_integral_demo.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
